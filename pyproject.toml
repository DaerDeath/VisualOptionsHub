[project]
name = "visual-options"
version = "0.1.0"
description = "Toolkit de análisis de opciones basado en 'Visual Guide to Options' de Jared Levy (Bloomberg Financial)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ibkr = ["ib-async>=1.0"]

[project.scripts]
voptions = "visual_options.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visual_options"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["visual_options/data/ibkr.py"]  # requiere TWS/IB Gateway en vivo
