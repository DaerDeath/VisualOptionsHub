<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visual-options</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/" title="inicio">
    <span class="brand-name">visual-options</span>
    <span id="viewTitle" class="brand-sub">terminal</span>
  </a>
  <div class="quote" id="quoteBox" hidden>
    <input id="symbolInput" class="symbol-input" spellcheck="false" autocomplete="off"
           title="cambiar símbolo (Enter)">
    <span id="price" class="price">—</span>
  </div>
  <div class="aggregates" id="aggBox" hidden>
    <div class="chip chip-put"><span class="chip-label">Put Sell %</span><span id="putSell" class="chip-value">—</span></div>
    <div class="chip chip-call"><span class="chip-label">Call Sell %</span><span id="callSell" class="chip-value">—</span></div>
  </div>
  <nav class="viewnav" id="viewNav" hidden>
    <a data-view="flow" href="#">flujo</a>
    <a data-view="setup" href="#">setup</a>
    <a data-view="footprint" href="#">footprint</a>
    <a data-view="dealer" href="#">dealer</a>
    <a data-view="levels" href="#">niveles</a>
    <a data-view="heatmap" href="#">heatmap</a>
    <a data-view="hiro" href="#">hiro</a>
    <a data-view="vol" href="#">vol</a>
    <a data-view="oi" href="#">oi</a>
    <a data-view="tape" href="#">tape</a>
    <a data-view="scanner" href="#">scanner</a>
    <a data-view="calc" href="#">calc</a>
    <a data-view="maxpain" href="#">maxpain</a>
    <a data-view="cvd" href="#">cvd</a>
    <a data-view="tpo" href="#">tpo</a>
    <a data-view="probs" href="#">probs</a>
    <a data-view="vwap" href="#">vwap</a>
    <a data-view="pcr" href="#">p/c</a>
    <a data-view="alerts" href="#">alertas</a>
    <a data-view="journal" href="#">diario</a>
    <a data-view="guide" href="#">guía</a>
  </nav>
  <div class="session">
    <div class="srcnav" id="srcNav" title="proveedor de datos"></div>
    <span id="clock" class="clock"></span>
    <span id="status" class="status" title="estado de la conexión"></span>
    <button id="pauseBtn" class="btn" hidden title="pausar / reanudar (espacio)">⏸</button>
  </div>
</header>

<main id="view"></main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/shared.js"></script>
<script src="/static/symbols.js"></script>
<script src="/static/home.js"></script>
<script src="/static/flow.js"></script>
<script src="/static/footprint.js"></script>
<script src="/static/setup.js"></script>
<script src="/static/dealer.js"></script>
<script src="/static/levels.js"></script>
<script src="/static/heatmap.js"></script>
<script src="/static/hiro.js"></script>
<script src="/static/vol.js"></script>
<script src="/static/oi.js"></script>
<script src="/static/tape.js"></script>
<script src="/static/scanner.js"></script>
<script src="/static/calc.js"></script>
<script src="/static/maxpain.js"></script>
<script src="/static/cvd.js"></script>
<script src="/static/tpo.js"></script>
<script src="/static/probs.js"></script>
<script src="/static/vwap.js"></script>
<script src="/static/pcr.js"></script>
<script src="/static/alerts.js"></script>
<script src="/static/journal.js"></script>
<script src="/static/guide.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
